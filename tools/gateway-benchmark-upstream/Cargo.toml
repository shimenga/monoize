[package]
name = "monoize-benchmark-upstream"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = "0.3.31"
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "io-std", "sync"] }
